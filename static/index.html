<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>μplot</title>
<style>
  /* Schriften liegen lokal in static/fonts (SIL Open Font License) */
  @font-face { font-family: 'Space Grotesk'; src: url(static/fonts/space-grotesk.woff2) format('woff2');
               font-weight: 300 700; font-display: swap; }
  @font-face { font-family: 'JetBrains Mono'; src: url(static/fonts/jetbrains-mono.woff2) format('woff2');
               font-weight: 100 800; font-display: swap; }
  :root {
    --sans: 'Space Grotesk', system-ui, sans-serif; --mono: 'JetBrains Mono', ui-monospace, monospace;
    --bg: #f3f4f6; --panel: #ffffff; --field: #ffffff; --ink: #0c0d10; --muted: #71737c; --line: #e3e4e8; --line-strong: #c9cbd2;
    --accent: #2340ff; --accent-soft: #e8ebff; --accent-ink: #ffffff; --warn: #d4380d; --warn-bg: #fff1eb;
    --bed: #e6e8ec; --area: #ffffff; --stroke: #0c0d10; --travel: #ff5a36; --head: #2340ff; --hatch: #d3d6dd; --safety: #ff9a80;
    --dot: #d9dbe1;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0b0c0f; --panel: #121318; --field: #0b0c0f; --ink: #eceef3; --muted: #8b8e99; --line: #23252d; --line-strong: #353843;
      --accent: #7187ff; --accent-soft: #1b2146; --accent-ink: #0b0c0f; --warn: #ff8a66; --warn-bg: #2d1710;
      --bed: #1a1c22; --area: #eceae4; --stroke: #0c0d10; --travel: #ff6b47; --head: #7187ff; --hatch: #2a2d36; --safety: #ff8a66;
      --dot: #1e2027;
    }
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { margin: 0; font: 14px/1.45 var(--sans); background: var(--bg); color: var(--ink);
         display: grid; grid-template-columns: 372px 1fr; height: 100vh; -webkit-font-smoothing: antialiased; }
  ::selection { background: var(--accent); color: var(--accent-ink); }
  a { color: inherit; text-decoration-color: var(--accent); text-underline-offset: 2px; }
  a:hover { color: var(--accent); }

  /* ---------- Seitenleiste ---------- */
  aside { background: var(--panel); border-right: 1px solid var(--line); overflow-y: auto; padding: 18px 20px 28px;
          scrollbar-gutter: stable; counter-reset: sec; }   /* Platz für die Scrollbar reservieren, damit nichts springt */
  .head { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin: 0 0 18px; }
  .brand { display: flex; align-items: center; gap: 10px; }
  .brand svg { width: 36px; height: 36px; border-radius: 9px; background: var(--ink); cursor: pointer; flex: none; }
  h1 { font-size: 22px; line-height: 1; margin: 0; font-weight: 700; letter-spacing: -.03em; }
  h1 small { display: block; white-space: nowrap; font: 500 10px/1.3 var(--mono); letter-spacing: .02em; color: var(--muted); margin-top: 4px; }
  .head select { width: auto; padding: 4px 8px; font-size: 12px; }
  h2, details summary { display: flex; align-items: baseline; gap: 10px; font-size: 15px; font-weight: 600; letter-spacing: -.01em;
       margin: 26px 0 12px; padding-top: 14px; border-top: 1px solid var(--line); color: var(--ink); }
  h2::before, details summary::before { counter-increment: sec; content: counter(sec, decimal-leading-zero);
       font: 500 11px var(--mono); color: var(--accent); }
  details summary { cursor: pointer; list-style: none; }
  details summary::-webkit-details-marker { display: none; }
  details summary::after { content: '+'; margin-left: auto; font: 400 16px var(--mono); color: var(--muted); }
  details[open] summary::after { content: '−'; }

  .drop { border: 1px dashed var(--line-strong); border-radius: 10px; padding: 20px 14px;
          text-align: center; cursor: pointer; color: var(--muted); transition: border-color .15s, background .15s; }
  .drop:hover, .drop.over { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); }
  .drop strong { color: var(--ink); display: block; word-break: break-all; font-weight: 600; font-size: 15px; }

  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 12px; align-items: end; }
  label { display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: var(--muted); }
  label.check { flex-direction: row; align-items: center; gap: 9px; color: var(--ink); font-size: 13px; grid-column: 1 / -1; cursor: pointer; }
  input:disabled { opacity: .4; }
  input[type=number], input[type=text], select {
         font: 500 13px var(--mono); color: var(--ink); background: var(--field); border: 1px solid var(--line-strong);
         border-radius: 6px; padding: 6px 8px; width: 100%; transition: border-color .15s, box-shadow .15s; }
  input[type=text], select { font-family: var(--sans); font-size: 14px; font-weight: 400; }
  input:focus-visible, select:focus-visible, button:focus-visible {
         outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  input[type=checkbox] { width: 16px; height: 16px; margin: 0; accent-color: var(--accent); }
  input[type=color] { width: 100%; height: 32px; padding: 3px; border: 1px solid var(--line-strong); border-radius: 6px;
                      background: var(--field); cursor: pointer; }
  input[type=color]::-webkit-color-swatch-wrapper { padding: 0; }
  input[type=color]::-webkit-color-swatch { border: none; border-radius: 3px; }
  button { font: 500 13px var(--sans); border: 1px solid var(--line-strong); background: var(--panel); color: var(--ink);
           border-radius: 99px; padding: 6px 14px; cursor: pointer; transition: border-color .15s, background .15s, color .15s; }
  button:hover:not(:disabled) { border-color: var(--ink); }
  button.primary { background: var(--ink); color: var(--panel); border-color: var(--ink); font-weight: 600; }
  button.primary:hover:not(:disabled) { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  button:disabled { opacity: .35; cursor: default; }
  .row { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
  .hint { font-size: 12px; color: var(--muted); margin: 8px 0 0; }
  .derived { grid-column: 1 / -1; font-size: 12px; background: var(--accent-soft); color: var(--ink); border-radius: 6px; padding: 8px 10px; }
  .derived b { font: 600 12px var(--mono); color: var(--accent); }
  .derived.bad { background: var(--warn-bg); color: var(--warn); }
  .derived.bad b { color: inherit; }
  .lt { display: flex; align-items: center; gap: 5px; }
  .info { display: inline-grid; place-items: center; width: 15px; height: 15px; border-radius: 50%; flex: none;
          border: 1px solid var(--line-strong); color: var(--muted); font: 600 9px/1 var(--mono); cursor: help; }
  .info:hover, .info:focus-visible { border-color: var(--accent); color: var(--accent); outline: none; }
  #tip { position: fixed; z-index: 10; max-width: 260px; padding: 9px 11px; border-radius: 8px; font-size: 12px;
         line-height: 1.5; background: var(--ink); color: var(--panel); pointer-events: none; display: none;
         box-shadow: 0 8px 24px rgb(0 0 0 / .18); }
  .preset-row { display: flex; gap: 8px; align-items: center; }
  .preset-row select { flex: 1; }
  .badge { font: 500 10px var(--mono); text-transform: uppercase; letter-spacing: .04em; padding: 3px 8px; border-radius: 99px;
           background: var(--warn-bg); color: var(--warn); white-space: nowrap; }
  .saveas input { flex: 1; min-width: 0; }
  .swatch { width: 12px; height: 12px; border-radius: 50%; flex: none; }

  /* ---------- Arbeitsfläche ---------- */
  main { display: grid; grid-template-rows: auto 1fr auto; min-width: 0; }
  .toolbar { display: flex; gap: 16px; align-items: center; padding: 12px 20px; border-bottom: 1px solid var(--line);
             background: var(--panel); flex-wrap: wrap; }
  .stats { display: flex; gap: 28px; flex-wrap: wrap; }
  .stat b { display: block; font: 600 18px/1.2 var(--mono); letter-spacing: -.02em; }
  .stat span { font-size: 11px; color: var(--muted); }
  .spacer { flex: 1; }
  .stage { position: relative; min-height: 0;
           background: radial-gradient(circle, var(--dot) 1px, transparent 1.2px) 0 0 / 16px 16px, var(--bg); }
  canvas#canvas { position: absolute; inset: 0; width: 100%; height: 100%; cursor: grab; }
  .empty { position: absolute; inset: 0; display: grid; place-items: center; color: var(--muted); pointer-events: none; }
  .bottom { padding: 12px 20px; border-top: 1px solid var(--line); background: var(--panel); display: grid; gap: 10px; }
  input[type=range] { width: 100%; accent-color: var(--accent); }
  .msg { padding: 8px 11px; border-radius: 6px; background: var(--warn-bg); color: var(--warn); white-space: pre-wrap; font-size: 13px; }
  .legend { display: flex; gap: 18px; flex-wrap: wrap; font-size: 12px; color: var(--muted); align-items: center; }
  .legend svg { vertical-align: -3px; margin-right: 6px; }
  .progress { display: flex; gap: 12px; align-items: center; font-size: 12px; color: var(--muted); white-space: nowrap; }
  .foot { font-size: 12px; color: var(--muted); }
  @media (max-width: 800px) {
    body { grid-template-columns: 1fr; height: auto; }
    main { height: 80vh; }
  }
</style>
</head>
<body>
<aside>
  <div class="head">
    <div class="brand">
      <svg id="mark" viewBox="0 0 34 34" role="img" aria-label="μplot"></svg>
      <h1>µplot<small data-i18n="tagline"></small></h1>
    </div>
    <select id="lang" data-i18n-aria="lang"></select>
  </div>

  <div class="drop" id="drop">
    <strong id="fileName" data-i18n="drop.title"></strong>
    <span data-i18n="drop.sub"></span>
    <input type="file" id="file" accept=".svg,.png,.jpg,.jpeg,image/svg+xml,image/png,image/jpeg" hidden>
  </div>
  <div class="row" style="margin-top:8px">
    <select id="example"><option value="" data-i18n="example"></option></select>
  </div>

  <form id="form">
    <div id="traceBox" hidden>
      <h2 data-i18n="h.trace"></h2>
      <div class="grid">
        <label><span class="lt"><span data-i18n="trace_mode"></span><span class="info" tabindex="0" role="button" aria-label="Info" data-i18n-tip="tip.trace_mode">i</span></span>
          <select name="trace_mode"><option value="hatch" data-i18n="trace.hatch"></option><option value="outline" data-i18n="trace.outline"></option></select></label>
        <label data-trace="outline"><span class="lt"><span data-i18n="trace_threshold"></span><span class="info" tabindex="0" role="button" aria-label="Info" data-i18n-tip="tip.trace_threshold">i</span></span><input type="number" name="trace_threshold" step="5" min="0" max="100"></label>
        <label data-trace="outline"><span class="lt"><span data-i18n="trace_centerline"></span><span class="info" tabindex="0" role="button" aria-label="Info" data-i18n-tip="tip.trace_centerline">i</span></span><input type="number" name="trace_centerline" step="0.5" min="0" max="100"></label>
        <label data-trace="hatch"><span class="lt"><span data-i18n="trace_spacing"></span><span class="info" tabindex="0" role="button" aria-label="Info" data-i18n-tip="tip.trace_spacing">i</span></span><input type="number" name="trace_spacing" step="0.1" min="0.2" max="20"></label>
        <label data-trace="hatch"><span class="lt"><span data-i18n="trace_levels"></span><span class="info" tabindex="0" role="button" aria-label="Info" data-i18n-tip="tip.trace_levels">i</span></span><input type="number" name="trace_levels" step="1" min="1" max="4"></label>
      </div>
      <div class="row" style="margin-top:8px">
        <button type="button" id="downloadSvg" data-i18n="downloadSvg" disabled></button>
      </div>
    </div>

    <h2 data-i18n="h.layout"></h2>
    <div class="grid">
      <label class="check"><input type="checkbox" name="fit"> <span data-i18n="fit"></span><span class="info" tabindex="0" role="button" aria-label="Info" data-i18n-tip="tip.fit">i</span></label>
      <label><span class="lt"><span data-i18n="margin"></span></span><input type="number" name="margin" step="0.5" min="0"></label>
      <label class="check"><input type="checkbox" name="center"> <span data-i18n="center"></span></label>
      <label><span class="lt"><span data-i18n="pos_x"></span><span class="info" tabindex="0" role="button" aria-label="Info" data-i18n-tip="tip.pos">i</span></span><input type="number" name="pos_x" step="0.5"></label>
      <label><span class="lt"><span data-i18n="pos_y"></span></span><input type="number" name="pos_y" step="0.5"></label>
      <label><span class="lt"><span data-i18n="angle"></span></span><input type="number" name="angle" step="1" min="0" max="360"></label>
      <span></span>
      <label class="check" style="grid-column:auto"><input type="checkbox" name="mirror_x"> <span data-i18n="mirror_x"></span></label>
      <label class="check" style="grid-column:auto"><input type="checkbox" name="mirror_y"> <span data-i18n="mirror_y"></span></label>
    </div>

    <h2 data-i18n="h.optim"></h2>
    <div class="grid">
      <label class="check"><input type="checkbox" name="linesort"> <span data-i18n="linesort"></span></label>
      <label><span class="lt"><span data-i18n="linemerge_tol"></span></span><input type="number" name="linemerge_tol" step="0.05" min="0"></label>
      <label><span class="lt"><span data-i18n="simplify_tol"></span></span><input type="number" name="simplify_tol" step="0.05" min="0"></label>
      <label><span class="lt"><span data-i18n="min_length"></span></span><input type="number" name="min_length" step="0.1" min="0"></label>
    </div>
    <div class="row" style="margin-top:8px">
      <button type="button" id="draft" data-i18n="draft"></button>
      <button type="button" id="normal" data-i18n="normal"></button>
    </div>

    <h2 data-i18n="h.pen"></h2>
    <div class="presets" id="penPresets">
      <div class="grid" data-role="fields" style="margin-top:8px">
      <label><span class="lt"><span data-i18n="pen_color"></span></span><input type="color" name="pen_color"></label>
      <label><span class="lt"><span data-i18n="pen_width"></span><span class="info" tabindex="0" role="button" aria-label="Info" data-i18n-tip="tip.pen_width">i</span></span><input type="number" name="pen_width" step="0.05" min="0.05" max="20"></label>
      </div>
    </div>

    <h2 data-i18n="h.profile"></h2>
    <div class="presets" id="printerPresets">
      <div class="grid" data-role="fields" style="margin-top:8px">
        <label><span class="lt"><span data-i18n="machine"></span><span class="info" tabindex="0" role="button" aria-label="Info" data-i18n-tip="tip.machine">i</span></span>
          <select name="machine"><option value="printer" data-i18n="machine.printer"></option><option value="axidraw" data-i18n="machine.axidraw"></option></select></label>
        <label data-machine="axidraw"><span class="lt"><span data-i18n="axidraw_model"></span><span class="info" tabindex="0" role="button" aria-label="Info" data-i18n-tip="tip.axidraw_model">i</span></span>
          <select id="axidrawModel"><option value="" data-i18n="axidraw_model.custom"></option></select></label>
      </div>
    </div>

    <details>
      <summary data-i18n="h.calib"></summary>
      <div class="grid">
        <label><span class="lt"><span data-i18n="bed_w" data-i18n-axidraw="area_w"></span><span class="info" tabindex="0" role="button" aria-label="Info" data-i18n-tip="tip.bed" data-i18n-axidraw-tip="tip.area">i</span></span><input type="number" name="bed_w" step="1" min="1"></label>
        <label><span class="lt"><span data-i18n="bed_h" data-i18n-axidraw="area_h"></span></span><input type="number" name="bed_h" step="1" min="1"></label>
        <label data-machine="printer"><span class="lt"><span data-i18n="offset_x"></span><span class="info" tabindex="0" role="button" aria-label="Info" data-i18n-tip="tip.offset">i</span></span><input type="number" name="offset_x" step="0.1"></label>
        <label data-machine="printer"><span class="lt"><span data-i18n="offset_y"></span></span><input type="number" name="offset_y" step="0.1"></label>
        <label><span class="lt"><span data-i18n="safety"></span><span class="info" tabindex="0" role="button" aria-label="Info" data-i18n-tip="tip.safety">i</span></span><input type="number" name="safety" step="0.5" min="0"></label>
        <div class="derived" id="derived"></div>
        <label data-machine="printer"><span class="lt"><span data-i18n="z_down"></span><span class="info" tabindex="0" role="button" aria-label="Info" data-i18n-tip="tip.z_down">i</span></span><input type="number" name="z_down" step="0.1"></label>
        <label data-machine="printer"><span class="lt"><span data-i18n="z_up"></span><span class="info" tabindex="0" role="button" aria-label="Info" data-i18n-tip="tip.z_up">i</span></span><input type="number" name="z_up" step="0.1"></label>
        <label data-machine="printer"><span class="lt"><span data-i18n="z_travel"></span><span class="info" tabindex="0" role="button" aria-label="Info" data-i18n-tip="tip.z_travel">i</span></span><input type="number" name="z_travel" step="0.1"></label>
        <span data-machine="printer"></span>
        <label data-machine="printer"><span class="lt"><span data-i18n="park_x"></span><span class="info" tabindex="0" role="button" aria-label="Info" data-i18n-tip="tip.park">i</span></span><input type="number" name="park_x" step="1"></label>
        <label data-machine="printer"><span class="lt"><span data-i18n="park_y"></span></span><input type="number" name="park_y" step="1"></label>
      </div>
      <p class="hint" data-i18n-html="calib.hint.html" data-machine="printer"></p>
      <p class="hint" data-i18n="calib.hint.axidraw" data-machine="axidraw"></p>
    </details>

    <details>
      <summary data-i18n="h.speeds"></summary>
      <div class="grid">
        <label><span class="lt"><span data-i18n="feed_draw"></span><span class="info" tabindex="0" role="button" aria-label="Info" data-i18n-tip="tip.feed_draw">i</span></span><input type="number" name="feed_draw" step="100"></label>
        <label><span class="lt"><span data-i18n="feed_travel"></span><span class="info" tabindex="0" role="button" aria-label="Info" data-i18n-tip="tip.feed_travel">i</span></span><input type="number" name="feed_travel" step="100"></label>
        <label data-machine="printer"><span class="lt"><span data-i18n="feed_z"></span><span class="info" tabindex="0" role="button" aria-label="Info" data-i18n-tip="tip.feed_z">i</span></span><input type="number" name="feed_z" step="10"></label>
      </div>
    </details>
  </form>
</aside>

<main>
  <div class="toolbar">
    <div class="stats" id="stats"></div>
    <div class="spacer"></div>
    <label class="check" style="grid-column:auto"><input type="checkbox" id="showTravel" checked> <span data-i18n="showTravel"></span></label>
    <button id="fitView" data-i18n="fitView"></button>
    <button class="primary" id="download" data-i18n="download" disabled></button>
  </div>
  <div class="stage" id="stage">
    <canvas id="canvas"></canvas>
    <div class="empty" id="empty" data-i18n="empty"></div>
  </div>
  <div class="bottom">
    <div id="messages"></div>
    <div class="legend" id="legend"></div>
    <div class="progress"><span data-i18n="progress"></span>
      <input type="range" id="progress" min="0" max="1000" value="1000"></div>
    <footer class="foot" data-i18n-html="footer.html"></footer>
  </div>
</main>

<div id="tip" role="tooltip"></div>
<script src="static/i18n.js"></script>
<script>
const BED = { w: 250, h: 210 };          // Druckbett, Nullpunkt unten links; wird aus dem Formular aktualisiert
const $ = (id) => document.getElementById(id);
const form = $('form');
// API-Aufrufe mit der gewählten Sprache, damit auch Fehlermeldungen des Servers passen
const api = (url, opts = {}) => fetch(url, { ...opts, headers: { ...opts.headers, 'Accept-Language': LANG } });
let DEFAULTS = {}, MODELS = [], svgFile = null, imageFile = null, result = null, moves = [], view = null;

// ---------- Einstellungen ----------
function readForm() {
  const s = {};
  for (const el of form.elements) {
    if (!el.name) continue;
    if (el.type === 'radio') { if (el.checked) s[el.name] = el.value; continue; }
    s[el.name] = el.type === 'checkbox' ? el.checked : el.value;
  }
  return s;
}
function writeForm(s) {
  for (const el of form.elements) {
    if (!el.name || !(el.name in s)) continue;
    if (el.type === 'radio') el.checked = el.value === s[el.name];
    else if (el.type === 'checkbox') el.checked = !!s[el.name]; else el.value = s[el.name];
  }
}
function save() { try { localStorage.setItem('plotter-settings', JSON.stringify(readForm())); } catch {} }
function load() { try { return JSON.parse(localStorage.getItem('plotter-settings') || '{}'); } catch { return {}; } }

// ---------- Datei ----------
const isImage = (file) => /^image\/(png|jpeg)$/.test(file.type) || /\.(png|jpe?g)$/i.test(file.name);
function setFile(file) {
  delete $('fileName').dataset.i18n;
  $('fileName').textContent = file.name;
  // PNG/JPG wandelt der Server erst in ein SVG um (raster.py), danach geht es weiter wie mit einem SVG
  imageFile = isImage(file) ? file : null;
  $('traceBox').hidden = !imageFile;
  if (imageFile) { svgFile = null; trace(); } else { svgFile = file; convert(); }
}
$('drop').onclick = () => $('file').click();
$('file').onchange = (e) => e.target.files[0] && setFile(e.target.files[0]);
$('drop').ondragover = (e) => { e.preventDefault(); $('drop').classList.add('over'); };
$('drop').ondragleave = () => $('drop').classList.remove('over');
$('drop').ondrop = (e) => {
  e.preventDefault(); $('drop').classList.remove('over');
  const f = e.dataTransfer.files[0]; if (f) setFile(f);
};
$('example').onchange = async (e) => {
  const name = e.target.value; if (!name) return;
  const blob = await (await api('/api/example/' + encodeURIComponent(name))).blob();
  setFile(new File([blob], name, { type: 'image/svg+xml' }));
  e.target.value = '';
};

// ---------- Maschinentyp ----------
// AxiDraw: kein Düsen-Stift-Versatz, feste Stifthöhen (Z0 unten, Z1 oben), Nullpunkt oben links, y nach unten.
// Gleiche Werte wie AXIDRAW_FIXED in app.py; die ausgeblendeten Felder behalten ihre Druckerwerte.
const AXIDRAW_FIXED = { offset_x: 0, offset_y: 0, z_down: 0, z_up: 1, z_travel: 1 };
const isAxidraw = () => form.elements.machine.value === 'axidraw';
const effective = (s) => s.machine === 'axidraw' ? { ...s, ...AXIDRAW_FIXED } : s;
function syncMachine() {
  const ax = isAxidraw();

// Modellvorlage passend zu den eingestellten Maßen anzeigen
function syncModel() {
  const s = readForm(), i = MODELS.findIndex((m) => m.w === +s.bed_w && m.h === +s.bed_h);
  $('axidrawModel').value = i < 0 ? '' : String(i);
}
function setModel(i) {

  $('axidrawModel').value = String(i);

$('axidrawModel').onchange = (e) => e.target.value !== '' && setModel(+e.target.value);

// ---------- Plotbare Fläche ----------
// Der Stift steht bei Düse im Nullpunkt immer auf 0|0 des Betts, der Versatz Stift→Düse ist also
// genau der Nullpunkt. Gleiche Formel wie plot_area() in app.py.
function plotArea(s) {
  s = effective(s);
  const reachW = +s.bed_w - +s.offset_x, reachH = +s.bed_h - +s.offset_y;   // vom Stift erreichbar
  return { reachW, reachH, w: reachW - +s.safety, h: reachH - +s.safety };
}
function showDerived() {
  const s = readForm(), a = plotArea(s), f1 = (v) => (Math.round(v * 10) / 10).toLocaleString(LANG);
  const w = +s.bed_w || 250, h = +s.bed_h || 210;
  if (w !== BED.w || h !== BED.h) { BED.w = w; BED.h = h; view && fitView(); }
  const bad = a.w <= 0 || a.h <= 0;
  $('derived').className = 'derived' + (bad ? ' bad' : '');
  $('derived').innerHTML = t('area.html', { w: f1(a.w), h: f1(a.h) }) + (bad ? '<br>' + t('area.empty') : '');
  $('bedLegend').textContent = t(isAxidraw() ? 'legend.area' : 'legend.bed', { w: f1(BED.w), h: f1(BED.h) });
}
form.addEventListener('input', () => { showDerived(); draw(); });

// Info-Tooltips (Hover, Tastatur und Antippen)
function showTip(el) {
  const tip = $('tip'), r = el.getBoundingClientRect();
  tip.textContent = el.dataset.tip; tip.style.display = 'block';
  const w = tip.offsetWidth, h = tip.offsetHeight;
  tip.style.left = Math.max(8, Math.min(innerWidth - w - 8, r.left + r.width / 2 - w / 2)) + 'px';
  tip.style.top = (r.bottom + 6 + h > innerHeight ? r.top - h - 6 : r.bottom + 6) + 'px';

for (const el of document.querySelectorAll('.info')) {

function formData(file, field) {
  const fd = new FormData();
  fd.append(field, file);
  for (const [k, v] of Object.entries(readForm())) fd.append(k, typeof v === 'boolean' ? (v ? '1' : '0') : v);
  return fd;
}
function failed(err) {
  result = null; moves = []; box = null; draw(); renderStats();
  showMessages([String(err.message || err)]);
}

// Bild → SVG; das Ergebnis wird auf die plotbare Fläche eingepasst
async function trace() {
  if (!imageFile) return;
  const my = ++seq;
  $('download').disabled = $('downloadSvg').disabled = true;
  showMessages([t('tracing')], true);
  let data;
  try {
    const res = await api('/api/trace', { method: 'POST', body: formData(imageFile, 'image') });
    data = await res.json();
    if (!res.ok) throw new Error(data.error || res.statusText);
  } catch (err) {
    if (my === seq) failed(err);
    return;
  }
  if (my !== seq) return;
  svgFile = new File([data.svg], imageFile.name.replace(/\.\w+$/, '') + '.svg', { type: 'image/svg+xml' });
  $('downloadSvg').disabled = false;
  convert();
}
// ---------- Profile (Drucker und Stift) ----------
// Beide Profilarten funktionieren gleich: Auswahl, Speichern, Speichern unter, Verwerfen, Löschen.
// Das Standardprofil lässt sich überschreiben und zurücksetzen.
function presetManager({ root, url, storeKey, hint, placeholder, onApply }) {
  const fields = root.querySelector('[data-role=fields]');   // optionale Eingabefelder direkt unter der Auswahl
  root.innerHTML = `
    <div class="preset-row">
      <select data-role="select"></select>
      <span class="badge" data-role="badge" data-i18n="modified" hidden></span>
    </div>
    <div class="row" style="margin-top:8px">
      <button type="button" data-role="save" data-i18n="save"></button>
      <button type="button" data-role="saveAs" data-i18n="saveAs"></button>
      <button type="button" data-role="revert" data-i18n="revert"></button>
      <button type="button" data-role="delete"></button>
    </div>
    <div class="row saveas" data-role="saveAsRow" style="margin-top:8px" hidden>
      <input type="text" data-role="name" maxlength="60" data-i18n-placeholder="${placeholder}" data-i18n-aria="presetNameLabel">
      <button type="button" class="primary" data-role="ok" data-i18n="ok"></button>
      <button type="button" data-role="cancel" data-i18n="cancel"></button>
    </div>
    <p class="hint" data-role="msg" data-i18n="${hint}"></p>`;
  const el = (r) => root.querySelector(`[data-role=${r}]`), sel = el('select');
  if (fields) sel.parentElement.after(fields);
  sel.setAttribute('data-i18n-aria', root.previousElementSibling.dataset.i18n);
  let list = [], keys = [], builtin = null, last = null;
  const byName = (n) => list.find((p) => p.name === n);
  const current = () => byName(sel.value);
  // Zahlen als Zahl vergleichen, Texte (Farbe) als Kleinbuchstaben
  const values = () => {
    const f = readForm();
    return Object.fromEntries(keys.map((k) => [k, typeof byName(builtin).settings[k] === 'number' ? +f[k] : String(f[k]).toLowerCase()]));
  };
  const modified = () => {
    const p = current(), v = values();
    return !!p && keys.some((k) => typeof v[k] === 'number' ? Math.abs(v[k] - p.settings[k]) > 1e-9 : v[k] !== p.settings[k]);
  };
  const say = (text, bad) => { el('msg').textContent = text; el('msg').style.color = bad ? 'var(--warn)' : ''; };
  const label = (p) => p.builtin ? t('builtin', { name: p.name }) : p.name;
  function update() {
    const p = current(), mod = modified();
    el('badge').hidden = !mod;
    el('save').disabled = !p || !mod;
    el('revert').disabled = !mod;
    el('delete').textContent = t(p?.builtin ? 'reset' : 'delete');
    el('delete').disabled = !p || (p.builtin && !p.customized);
    el('delete').title = p?.builtin ? t('resetTitle') : '';
  }
  async function reload(select) {
    const data = await (await api(url)).json();
    list = data.presets; builtin = data.builtin;
    keys = Object.keys(byName(builtin).settings);
    sel.innerHTML = '';
    for (const p of list) sel.add(new Option(label(p), p.name));
    sel.value = byName(select) ? select : builtin;
    last = sel.value;
    try { localStorage.setItem(storeKey, sel.value); } catch {}
    update();
  }
  function apply(name) { writeForm(byName(name).settings); save(); update(); onApply(); }
  sel.onchange = () => {
    if (last && last !== sel.value) {
      const cur = sel.value;
      sel.value = last;                      // zum Vergleichen kurz zurück
      const mod = modified();
      sel.value = cur;
      if (mod && !confirm(t('confirm.discard', { name: last }))) { sel.value = last; return; }
    }
    last = sel.value;
    try { localStorage.setItem(storeKey, last); } catch {}
    apply(last);
    say(t('msg.loaded', { name: last }));
  };
  async function put(name) {
    const res = await api(url + '/' + encodeURIComponent(name), {
      method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(values()),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || res.statusText);
  }
  el('save').onclick = async () => {
    const name = sel.value;
    try { await put(name); await reload(name); say(t('msg.saved', { name })); }
    catch (e) { say(e.message, true); }
  };
  el('saveAs').onclick = () => {
    el('saveAsRow').hidden = false;
    const p = current();
    el('name').value = p && !p.builtin ? p.name : '';
    el('name').focus(); el('name').select();
  };
  const closeSaveAs = () => { el('saveAsRow').hidden = true; };
  el('cancel').onclick = closeSaveAs;
  el('ok').onclick = async () => {
    const name = el('name').value.trim();
    if (!name) { say(t('msg.needName'), true); return; }
    if (byName(name) && !confirm(t('confirm.overwrite', { name }))) return;
    try { await put(name); await reload(name); closeSaveAs(); say(t('msg.saved', { name })); }
    catch (e) { say(e.message, true); }
  };
  el('name').onkeydown = (e) => {
    if (e.key === 'Enter') { e.preventDefault(); el('ok').click(); }
    if (e.key === 'Escape') closeSaveAs();
  };
  el('revert').onclick = () => { apply(sel.value); say(t('msg.discarded')); };
  el('delete').onclick = async () => {
    const name = sel.value, isBuiltin = current()?.builtin;
    if (!confirm(t(isBuiltin ? 'confirm.reset' : 'confirm.delete', { name }))) return;
    const res = await api(url + '/' + encodeURIComponent(name), { method: 'DELETE' });
    if (!res.ok) { say((await res.json()).error, true); return; }
    if (isBuiltin) { await reload(name); apply(name); say(t('msg.reset', { name })); return; }
    await reload(null);
    say(t('msg.deleted', { name }));
  };
  form.addEventListener('input', update);
  // Profilnamen (Standard-Zusatz) nach einem Sprachwechsel neu beschriften
  const relabel = () => { for (const o of sel.options) o.text = label(byName(o.value)); update(); };
  return { reload, relabel };
}

async function convert() {
  if (!svgFile) return;
  const my = ++seq;
  const fd = formData(svgFile, 'svg');
  $('download').disabled = true;
  showMessages([t('calculating')], true);
  let data;
  try {
    const res = await api('/api/convert', { method: 'POST', body: fd });
    data = await res.json();
    if (!res.ok) throw new Error(data.error || res.statusText);
  } catch (err) {
    if (my === seq) failed(err);
    return;
  }
  if (my !== seq) return;
  result = data;
  moves = parseGcode(data.gcode);
  box = drawBox(data.settings);
  if (box && data.settings.center) {   // zentrierte Lage übernehmen, damit Ausschalten sie beibehält
    writeForm({ pos_x: round1(box.x0), pos_y: round1(box.y0) }); save();
  }
  $('download').disabled = false;
  $('empty').style.display = 'none';
  renderStats();
  showMessages(checkBounds(data.settings));

}

// ---------- G-Code lesen ----------
function parseGcode(text) {
  let x = null, y = null, z = 30, f = 1000;
  const out = [];   // {x0,y0,x1,y1,draw,t}
  for (const raw of text.split('\n')) {
    const line = raw.split(';')[0].trim();
    if (!/^G0?[01]\b/i.test(line)) continue;
    let nx = x, ny = y, nz = z;
    for (const m of line.matchAll(/([XYZF])(-?[\d.]+)/gi)) {
      const v = parseFloat(m[2]);
      switch (m[1].toUpperCase()) { case 'X': nx = v; break; case 'Y': ny = v; break; case 'Z': nz = v; break; case 'F': f = v; }
    }
    if (x === null || y === null) { x = nx; y = ny; z = nz; continue; }
    const d = Math.hypot(nx - x, ny - y, nz - z);
    if (nx !== x || ny !== y) out.push({ x0: x, y0: y, x1: nx, y1: ny, draw: z <= penDownZ() + 1e-6, t: d / f * 60, len: Math.hypot(nx - x, ny - y) });
    else if (d) out.push({ t: d / f * 60 });   // reine Z-Bewegung: nur Zeit
    x = nx; y = ny; z = nz;
  }
  return out;
}
const penDownZ = () => isAxidraw() ? AXIDRAW_FIXED.z_down : parseFloat(form.elements.z_down.value);
const round1 = (v) => Math.round(v * 10) / 10;

// Umriss der gezeichneten Linien in Stiftkoordinaten (Bett)
let box = null;
function drawBox(s) {
  let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
  for (const m of moves) if (m.draw) {
    x0 = Math.min(x0, m.x0, m.x1); x1 = Math.max(x1, m.x0, m.x1);
    y0 = Math.min(y0, m.y0, m.y1); y1 = Math.max(y1, m.y0, m.y1);
  }
  if (x0 === Infinity) return null;
  return { x0: x0 - s.offset_x, y0: y0 - s.offset_y, x1: x1 - s.offset_x, y1: y1 - s.offset_y };
}
// Verschiebung der Vorschau gegenüber dem letzten G-Code, solange eine neue Position noch berechnet wird
function shift() {
  const s = readForm();
  if (!box || s.center) return { x: 0, y: 0 };
  return { x: (+s.pos_x || 0) - box.x0, y: (+s.pos_y || 0) - box.y0 };
}

function renderStats() {
  if (!moves.length) { $('stats').innerHTML = ''; return; }
  let drawLen = 0, travelLen = 0, secs = 0, lifts = 0, prevDraw = false;
  for (const m of moves) {
    secs += m.t;
    if (m.len === undefined) continue;
    if (m.draw) { drawLen += m.len; if (!prevDraw) lifts++; } else travelLen += m.len;
    prevDraw = m.draw;
  }
  const fmtLen = (mm) => mm >= 1000 ? (mm / 1000).toFixed(2) + ' m' : mm.toFixed(0) + ' mm';
  const min = Math.round(secs / 60);
  const items = [
    [t('stat.draw'), fmtLen(drawLen)], [t('stat.travel'), fmtLen(travelLen)], [t('stat.paths'), lifts],
    [t('stat.time'), min >= 60 ? `${Math.floor(min / 60)} h ${min % 60} min` : `${min} min`],
  ];
  $('stats').innerHTML = items.map(([k, v]) => `<div class="stat"><b>${v}</b><span>${k}</span></div>`).join('');
}

function checkBounds(s) {
  const minX = +s.offset_x, minY = +s.offset_y, maxX = minX + +s.area_w, maxY = minY + +s.area_h;
  let bx0 = Infinity, by0 = Infinity, bx1 = -Infinity, by1 = -Infinity;
  for (const m of moves) if (m.draw) {
    bx0 = Math.min(bx0, m.x0, m.x1); bx1 = Math.max(bx1, m.x0, m.x1);
    by0 = Math.min(by0, m.y0, m.y1); by1 = Math.max(by1, m.y0, m.y1);
  }
  if (bx0 === Infinity) return [t('bounds.none')];
  const eps = 0.01, out = [];
  const px0 = bx0 - s.offset_x, px1 = bx1 - s.offset_x, py0 = by0 - s.offset_y, py1 = by1 - s.offset_y;
  if (px0 < -eps || py0 < -eps || px1 > BED.w + eps || py1 > BED.h + eps)
    out.push(t('bounds.bed', { x0: px0.toFixed(1), x1: px1.toFixed(1), y0: py0.toFixed(1), y1: py1.toFixed(1), w: BED.w, h: BED.h }));
  if (bx0 < minX - eps || by0 < minY - eps || bx1 > maxX + eps || by1 > maxY + eps)
    out.push(t('bounds.area', { x0: bx0.toFixed(1), x1: bx1.toFixed(1), y0: by0.toFixed(1), y1: by1.toFixed(1), minX, maxX, minY, maxY }));
  return out;
}

function showMessages(list, neutral) {
  $('messages').innerHTML = list.map((m) =>
    `<div class="msg"${neutral ? ' style="background:transparent;color:var(--muted);padding:0"' : ''}></div>`).join('');
  [...$('messages').children].forEach((el, i) => el.textContent = list[i]);
}

// ---------- Vorschau ----------
const canvas = $('canvas'), ctx = canvas.getContext('2d');
const css = (n) => getComputedStyle(document.documentElement).getPropertyValue(n).trim();

function fitView() {
  // Platz für die X-Beschriftung an der Nullpunktkante: unten beim Drucker, oben beim AxiDraw
  const r = canvas.getBoundingClientRect(), padL = 44, pad = 20, padT = isAxidraw() ? 34 : pad, padB = isAxidraw() ? pad : 34;
  const k = Math.min((r.width - padL - pad) / BED.w, (r.height - padT - padB) / BED.h);
  view = { k, ox: padL + (r.width - padL - pad - BED.w * k) / 2, oy: padT + (r.height - padT - padB - BED.h * k) / 2 };
}
// Bettkoordinaten -> Bildschirm. Drucker: Nullpunkt unten links, y nach oben. AxiDraw: oben links, y nach unten.
const sx = (x) => view.ox + x * view.k;
const sy = (y) => view.oy + (isAxidraw() ? y : BED.h - y) * view.k;
// Rechteck vom Nullpunkt bis w × h, unabhängig von der y-Richtung
const originRect = (w, h) => [sx(0), Math.min(sy(0), sy(h)), w * view.k, h * view.k];

function draw() {
  const r = canvas.getBoundingClientRect(), dpr = devicePixelRatio || 1;
  canvas.width = r.width * dpr; canvas.height = r.height * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  if (!view) fitView();
  ctx.clearRect(0, 0, r.width, r.height);

  const s = effective(readForm()), ax = isAxidraw();
  const ox = +s.offset_x, oy = +s.offset_y;
  const sh = shift();
  const dx = -ox + sh.x, dy = -oy + sh.y;   // G-Code (Düse) -> Stift auf dem Bett, plus laufende Verschiebung

  // Druckbett
  ctx.fillStyle = css('--bed');
  ctx.fillRect(...originRect(BED.w, BED.h));
  // Schraffur für den nicht plotbaren Teil (die plotbare Fläche wird weiter unten darübergelegt)
  ctx.save();
  ctx.beginPath(); ctx.rect(...originRect(BED.w, BED.h)); ctx.clip();
  ctx.strokeStyle = css('--hatch'); ctx.lineWidth = 1; ctx.beginPath();
  const bw = BED.w * view.k, bh = BED.h * view.k;
  for (let d = -bh; d < bw; d += 8) { ctx.moveTo(sx(0) + d, sy(0)); ctx.lineTo(sx(0) + d + bh, sy(BED.h)); }
  ctx.stroke(); ctx.restore();
  // 5-cm-Raster wie auf dem Smooth Sheet + Achsbeschriftung
  ctx.strokeStyle = css('--line'); ctx.lineWidth = 1; ctx.beginPath();
  for (let x = 0; x <= BED.w; x += 50) { ctx.moveTo(sx(x), sy(0)); ctx.lineTo(sx(x), sy(BED.h)); }
  for (let y = 0; y <= BED.h; y += 50) { ctx.moveTo(sx(0), sy(y)); ctx.lineTo(sx(BED.w), sy(y)); }
  ctx.moveTo(sx(BED.w), sy(0)); ctx.lineTo(sx(BED.w), sy(BED.h)); ctx.lineTo(sx(0), sy(BED.h));
  ctx.stroke();
  ctx.fillStyle = css('--muted'); ctx.font = "11px 'JetBrains Mono', monospace";
  ctx.textAlign = 'center'; ctx.textBaseline = ax ? 'bottom' : 'top';
  const ly = sy(0) + (ax ? -6 : 6);
  ctx.fillText('0', sx(0) - 8, ly);
  for (let x = 50; x <= BED.w; x += 50) ctx.fillText(x, sx(x), ly);
  ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
  for (let y = 50; y <= BED.h; y += 50) ctx.fillText(y, sx(0) - 6, sy(y));   // die 0 steht schon an der X-Achse

  // erreichbarer Bereich: Sicherheitsabstand pink schraffiert, darüber die plotbare Fläche in Weiß
  const area = plotArea(s);
  const rw = Math.max(0, Math.min(area.reachW, BED.w)), rh = Math.max(0, Math.min(area.reachH, BED.h));
  if (rw > 0 && rh > 0) {
    ctx.fillStyle = css('--area');
    ctx.fillRect(...originRect(rw, rh));
    ctx.save();
    ctx.beginPath(); ctx.rect(...originRect(rw, rh)); ctx.clip();
    ctx.strokeStyle = css('--safety'); ctx.lineWidth = 1; ctx.beginPath();
    for (let d = -rh * view.k; d < rw * view.k; d += 6) { ctx.moveTo(sx(0) + d, sy(0)); ctx.lineTo(sx(0) + d + rh * view.k, sy(rh)); }
    ctx.stroke(); ctx.restore();
  }
  if (area.w > 0 && area.h > 0) {
    ctx.fillStyle = css('--area');
    ctx.shadowColor = 'rgb(0 0 0 / .10)'; ctx.shadowBlur = 16; ctx.shadowOffsetY = 3;
    const ar = originRect(Math.min(area.w, BED.w), Math.min(area.h, BED.h));
    ctx.fillRect(...ar);
    ctx.shadowColor = 'transparent'; ctx.shadowBlur = ctx.shadowOffsetY = 0;
    ctx.fillRect(...ar);
  }

  const n = Math.round(moves.length * $('progress').value / 1000);
  const stroke = (isDraw, color, width, dash) => {
    ctx.strokeStyle = color; ctx.lineWidth = width; ctx.setLineDash(dash); ctx.lineCap = ctx.lineJoin = 'round'; ctx.beginPath();
    for (let i = 0; i < n; i++) {
      const m = moves[i];
      if (m.len === undefined || m.draw !== isDraw) continue;
      ctx.moveTo(sx(m.x0 + dx), sy(m.y0 + dy)); ctx.lineTo(sx(m.x1 + dx), sy(m.y1 + dy));
    }
    ctx.stroke(); ctx.setLineDash([]);
  };
  if ($('showTravel').checked) stroke(false, css('--travel'), 0.6, [3, 3]);
  // Stiftfarbe und Strichbreite in echtem Maßstab (mindestens ein halbes Pixel, damit nichts verschwindet)
  stroke(true, /^#[0-9a-f]{6}$/i.test(s.pen_color) ? s.pen_color : css('--stroke'), Math.max(0.5, (+s.pen_width || 0.4) * view.k), []);
  ctx.lineCap = 'butt'; ctx.lineJoin = 'miter';

  // Stiftposition beim Scrubben
  if (n > 0 && n < moves.length) {
    let i = n - 1; while (i > 0 && moves[i].len === undefined) i--;
    const m = moves[i];
    if (m.x1 !== undefined) {
      ctx.fillStyle = css('--accent'); ctx.beginPath(); ctx.arc(sx(m.x1 + dx), sy(m.y1 + dy), 4, 0, 7); ctx.fill();
    }
  }

  // Umriss der Grafik beim Überfahren/Ziehen, mit Position der Ecke am Nullpunkt (Drucker unten links, AxiDraw oben links)
  if (box && (hover || grab)) {
    const x0 = sx(box.x0 + sh.x), y0 = sy(box.y0 + sh.y), x1 = sx(box.x1 + sh.x), y1 = sy(box.y1 + sh.y);
    ctx.strokeStyle = css('--accent'); ctx.lineWidth = 1; ctx.setLineDash([5, 4]);
    ctx.strokeRect(x0, y1, x1 - x0, y0 - y1); ctx.setLineDash([]);
    ctx.fillStyle = css('--accent'); ctx.beginPath(); ctx.arc(x0, y0, 3.5, 0, 7); ctx.fill();
    ctx.font = "600 11px 'JetBrains Mono', monospace"; ctx.textAlign = 'left'; ctx.textBaseline = 'top';
    ctx.fillText(`${round1(box.x0 + sh.x)} | ${round1(box.y0 + sh.y)}`, x0 + 6, y0 + 4);
  }

  // Nullpunkt: Düse (Kreis) und Stift (Fadenkreuz), verbunden durch den Versatz; das AxiDraw hat nur den Stift
  const head = css('--head');
  const nx = sx(ox), ny = sy(oy), px = sx(0), py = sy(0);
  ctx.strokeStyle = head; ctx.fillStyle = head; ctx.lineWidth = 1.5;
  if (!ax) {
    ctx.setLineDash([4, 3]); ctx.beginPath(); ctx.moveTo(nx, ny); ctx.lineTo(px, py); ctx.stroke(); ctx.setLineDash([]);
    ctx.beginPath(); ctx.arc(nx, ny, 7, 0, 7); ctx.stroke();
    ctx.beginPath(); ctx.arc(nx, ny, 2, 0, 7); ctx.fill();
  }
  ctx.beginPath();
  ctx.moveTo(px - 12, py); ctx.lineTo(px + 12, py); ctx.moveTo(px, py - 12); ctx.lineTo(px, py + 12);
  ctx.stroke();
  ctx.beginPath(); ctx.arc(px, py, 5, 0, 7); ctx.stroke();
  ctx.font = "600 11px 'JetBrains Mono', monospace"; ctx.textAlign = 'left'; ctx.textBaseline = 'bottom';
  const fmt = (v) => Math.round(v * 10) / 10;
  if (!ax) ctx.fillText(t('canvas.nozzle', { x: fmt(ox), y: fmt(oy) }), nx + 10, ny - 6);
  ctx.textBaseline = ax ? 'top' : 'bottom';
  ctx.fillText(t('canvas.pen'), px + 14, py + (ax ? 4 : -4));
}

// Zoom & Pan
canvas.addEventListener('wheel', (e) => {
  e.preventDefault();
  const r = canvas.getBoundingClientRect(), mx = e.clientX - r.left, my = e.clientY - r.top;
  const f = Math.exp(-e.deltaY * 0.0015);
  view.ox = mx - (mx - view.ox) * f; view.oy = my - (my - view.oy) * f; view.k *= f;
  draw();
}, { passive: false });
// Ziehen auf der Grafik verschiebt sie (setzt Position X/Y), sonst wird die Ansicht verschoben
let drag = null, grab = null, hover = false;
function overGraphic(e) {
  if (!box || !view) return false;
  const r = canvas.getBoundingClientRect(), sh = shift(), tol = 6;
  const mx = e.clientX - r.left, my = e.clientY - r.top;
  const ya = sy(box.y0 + sh.y), yb = sy(box.y1 + sh.y);
  return mx >= sx(box.x0 + sh.x) - tol && mx <= sx(box.x1 + sh.x) + tol &&
         my >= Math.min(ya, yb) - tol && my <= Math.max(ya, yb) + tol;
}
canvas.onpointerdown = (e) => {
  canvas.setPointerCapture(e.pointerId);
  if (overGraphic(e)) {
    const sh = shift();
    grab = { x: e.clientX, y: e.clientY, px: box.x0 + sh.x, py: box.y0 + sh.y };
    canvas.style.cursor = 'move';
    if (form.elements.center.checked) {   // Ziehen beendet das Zentrieren
      form.elements.center.checked = false;
      writeForm({ pos_x: round1(grab.px), pos_y: round1(grab.py) }); syncMargin();
    }
  } else {
    drag = { x: e.clientX, y: e.clientY }; canvas.style.cursor = 'grabbing';
  }
};
canvas.onpointermove = (e) => {
  if (grab) {
    writeForm({ pos_x: round1(grab.px + (e.clientX - grab.x) / view.k),
                pos_y: round1(grab.py + (isAxidraw() ? 1 : -1) * (e.clientY - grab.y) / view.k) });
    draw(); return;
  }
  if (drag) {
    view.ox += e.clientX - drag.x; view.oy += e.clientY - drag.y; drag = { x: e.clientX, y: e.clientY }; draw(); return;
  }
  const h = overGraphic(e);
  if (h !== hover) { hover = h; canvas.style.cursor = h ? 'move' : ''; draw(); }
};
canvas.onpointerup = () => {
  if (grab) { grab = null; save(); clearTimeout(timer); convert(); }
  drag = null; canvas.style.cursor = hover ? 'move' : '';
};
canvas.onpointerleave = () => { if (hover && !grab) { hover = false; draw(); } };
$('fitView').onclick = () => { fitView(); draw(); };
$('progress').oninput = draw;
$('showTravel').onchange = draw;
new ResizeObserver(() => { fitView(); draw(); }).observe($('stage'));
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', draw);

$('legend').innerHTML = `
  <span data-machine="printer"><svg width="16" height="16" viewBox="0 0 16 16"><circle cx="8" cy="8" r="6" fill="none" stroke="var(--head)" stroke-width="1.5"/><circle cx="8" cy="8" r="1.8" fill="var(--head)"/></svg><span data-i18n="legend.nozzle"></span></span>
  <span><svg width="16" height="16" viewBox="0 0 16 16"><path d="M0 8H16M8 0V16" stroke="var(--head)" stroke-width="1.5"/><circle cx="8" cy="8" r="4" fill="none" stroke="var(--head)" stroke-width="1.5"/></svg><span data-i18n="legend.pen"></span></span>
  <span><svg width="16" height="16" viewBox="0 0 16 16"><path d="M1 8H15" stroke="var(--travel)" stroke-dasharray="3 3"/></svg><span data-i18n="legend.travel"></span></span>
  <span><svg width="16" height="16" viewBox="0 0 16 16"><rect width="16" height="16" rx="2" fill="var(--area)" stroke="var(--line)"/><path d="M0 16L16 0M-4 8L8-4M8 20L20 8" stroke="var(--safety)"/></svg><span data-i18n="legend.safety"></span></span>
  <span data-machine="printer"><svg width="16" height="16" viewBox="0 0 16 16"><rect width="16" height="16" rx="2" fill="var(--bed)"/><path d="M0 16L16 0M-4 8L8-4M8 20L20 8" stroke="var(--hatch)"/></svg><span data-i18n="legend.unreachable"></span></span>
  <span id="bedLegend"></span>`;

// ---------- Generatives Logo ----------
// Ein kleines Strömungsfeld: Linien folgen einem Winkelfeld aus überlagerten Sinuswellen, wie ein Plotter sie zeichnen würde.
function flowLines(w, h, { lines, steps, step = 2, freq, seed = Math.random() * 2 ** 32 }) {
  let st = seed >>> 0;
  const rnd = () => (st = (st * 1664525 + 1013904223) >>> 0) / 2 ** 32;
  const a = rnd() * 6.3, b = rnd() * 6.3, c = rnd() * 6.3, turn = 1 + rnd() * 1.5;
  const angle = (x, y) => turn * (Math.sin(x * freq + a) + Math.cos(y * freq * 1.3 + b)) + Math.sin((x + y) * freq * .5 + c);
  const out = [], cols = Math.ceil(Math.sqrt(lines * w / h)), rows = Math.ceil(lines / cols);
  for (let i = 0; i < lines; i++) {
    let x = (i % cols + rnd()) * w / cols, y = (Math.floor(i / cols) + rnd()) * h / rows;
    const pts = [[x, y]];
    for (let j = 0; j < steps; j++) {
      const t = angle(x, y); x += Math.cos(t) * step; y += Math.sin(t) * step;
      if (x < 0 || y < 0 || x > w || y > h) break;
      pts.push([x, y]);
    }
    if (pts.length > 4) out.push('M' + pts.map(([px, py]) => px.toFixed(1) + ' ' + py.toFixed(1)).join('L'));
  }
  return out;
}
const pathEls = (ds, attrs) => ds.map((d, i) => `<path d="${d}" ${typeof attrs === 'function' ? attrs(i) : attrs}/>`).join('');
function drawMark() {   // Logo: bei jedem Laden (und Klick) ein neues Muster, eine Linie im Akzent
  const ds = flowLines(34, 34, { lines: 16, steps: 40, step: 1.1, freq: .13 });
  $('mark').innerHTML = pathEls(ds, (i) => `fill="none" stroke-linecap="round" stroke-width="${i ? .7 : 1.6}" stroke="${i ? 'var(--panel)' : 'var(--accent)'}" opacity="${i ? .8 : 1}"`);
}
$('mark').onclick = drawMark;
drawMark();

// ---------- Download ----------
function downloadBlob(blob, name) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = name; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}
$('download').onclick = () => {
  if (!result) return;
  downloadBlob(new Blob([result.gcode], { type: 'text/plain' }), (svgFile?.name || 'plot.svg').replace(/\.svg$/i, '') + '.gcode');
};
$('downloadSvg').onclick = () => svgFile && downloadBlob(svgFile, svgFile.name);

// ---------- Sprache ----------
for (const [code, name] of Object.entries(LANGS)) $('lang').add(new Option(name, code));
$('lang').value = LANG;
function relabel() {
  applyI18n();
  printerPresets.relabel(); penPresets.relabel(); showDerived(); renderStats();
  if (result) showMessages(checkBounds(result.settings));
  draw();
}
$('lang').onchange = () => {
  LANG = $('lang').value;
  try { localStorage.setItem('uplot-lang', LANG); } catch {}
  relabel();
};
applyI18n();

// ---------- Start ----------
(async () => {
  const data = await (await api('/api/defaults')).json();
  DEFAULTS = data.defaults; MODELS = data.axidraw_models;
  MODELS.forEach((m, i) => $('axidrawModel').add(new Option(`${m.name} (${m.w} × ${m.h} mm)`, i)));
  writeForm({ ...DEFAULTS, ...load() });
  syncMargin(); syncTrace(); syncMachine(); showDerived(); fitView();
  const stored = (k) => { try { return localStorage.getItem(k); } catch { return null; } };
  await Promise.all([printerPresets.reload(stored('plotter-preset')), penPresets.reload(stored('uplot-pen'))]);
  for (const name of data.examples) $('example').add(new Option(name, name));
  draw();
  document.fonts.ready.then(draw);   // Achsbeschriftung mit der geladenen Schrift neu zeichnen
})();
</script>
</body>
